# Deploy the landing page to Vercel on every push to main.
#
# This exists because the site did not have one. The Vercel project was linked
# once from a laptop with `vercel --prod`, and production then stayed frozen at
# whatever that machine happened to have: for months the live page served a
# three-theme switcher called day/night/card and claimed 181 unit tests, while
# main moved on to atmospheric/broadcast/fieldcard and 413. Nothing was broken
# and nothing complained, because a manual deploy that never happens again
# looks exactly like a working one.
#
# The landing page is a static directory with no build step, so this uploads
# it prebuilt rather than asking Vercel to run an install. The Vercel project's
# own Root Directory setting is what narrows the deploy to `landing/` and keeps
# the Expo app at the repo root out of it; the CLI therefore runs from the repo
# root, and the steps below check that a page came out the other end.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN        a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID       team_DbOeTFejpOueea6uxDHpoQGz
#   VERCEL_PROJECT_ID   prj_ve3t6gSIoj82Hqx3z40fHIZZ0vjP
#
# The two IDs are not credentials -- they are the same values `vercel link`
# writes into landing/.vercel/project.json, which is gitignored. They live in
# secrets so the workflow reads one way whether or not that file is present.

# SINCE ADDED: this also publishes the app itself at /app.
#
# The landing page describes the app; there was no way to open the app without
# a laptop, a cable and a simulator. The Expo web target fixes that, and it
# has to ride along in THIS workflow rather than in one of its own: a Vercel
# prebuilt deploy publishes one static tree and replaces whatever was there,
# so two workflows aiming at the same project would take turns deleting each
# other's output. One deploy, two things in it.
#
# What /app is NOT: a substitute for a device. No camera, no real GPS, and
# react-native-maps renders through the web shim. It is for reading layout,
# typography, themes and the seal on a real screen.
name: Deploy landing

# Every push to main, with no path filter.
#
# A filter on `landing/**` is the cheaper setting and it was the wrong one. It
# means production only moves when somebody happens to touch the page, so the
# live site silently represents whatever the last landing-page commit knew --
# which is the same failure this workflow was written to end, just with a
# smaller window. The deploy takes forty seconds and uploads a static
# directory; running it on a commit that changed nothing under `landing/`
# costs that and republishes identical bytes.
on:
  push:
    branches: [main]
  # So a stale production can be corrected without an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stormchaser-field.vercel.app
    env:
      # The one domain the README, the landing footer and the submission all
      # name. Every step below reads it from here so they cannot drift apart
      # again -- which is how production ended up frozen while CI went green.
      SITE_DOMAIN: stormchaser-field.vercel.app
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Install the app's dependencies
        run: npm ci

      # The export runs BEFORE the typecheck, which looks backwards and is not.
      #
      # `expo-env.d.ts` and `.expo/types` are both generated by the Expo CLI
      # and both gitignored, so a clean checkout has neither. `expo-env.d.ts`
      # is what references `expo/types`, which declares `*.css` and the typed
      # routes -- so on a runner, `tsc` saw `import '../global.css'` with no
      # declaration behind it and failed TS2882 on a file nobody had touched.
      # Running the export first puts those generated types on disk, so the
      # typecheck answers the same question here as it does on a laptop.
      # (`css.d.ts` now declares the CSS side of that independently; this
      # ordering is what covers the typed routes.)
      #
      # `experiments.baseUrl` in app.json is "/app" so every asset resolves
      # under that prefix. Absolute-rooted assets would 404 and the page would
      # be blank behind a clean 200 -- checked explicitly below, because from
      # the outside that looks exactly like a working deploy.
      - name: Export the app for web
        run: npx expo export --platform web --output-dir dist-web

      # Nothing is published until both of these pass. A deploy of a build
      # nobody checked is how production spent months on a stale commit; the
      # same mistake is cheaper to avoid than to find.
      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Check the app export is the app
        run: |
          set -euo pipefail
          page=dist-web/index.html
          if [ ! -s "$page" ]; then
            echo "::error::$page is missing or empty -- the export produced no app"
            find dist-web -maxdepth 2 2>/dev/null || echo "  (no dist-web at all)"
            exit 1
          fi
          grep -q '/app/_expo/static/js' "$page" || {
            echo "::error::$page does not reference its bundle under the /app base url"
            echo "what it does reference:"
            grep -o 'src="[^"]*"' "$page" || true
            exit 1
          }
          bundle=$(find dist-web/_expo/static/js -name '*.js' -size +100k | head -n1)
          [ -n "$bundle" ] || { echo "::error::no JS bundle over 100k -- the export is a stub"; exit 1; }
          echo "app page is $(wc -c < "$page") bytes, bundle is $(du -h "$bundle" | cut -f1)"

      # Fails loudly rather than deploying a page that lost its themes: these
      # are the markers that were missing from production the whole time.
      #
      # The three names are read out of the switcher rather than hardcoded. The
      # first version of this step spelled the third one `fieldcard`, the page
      # later renamed it `signage`, and the guard then blocked every deploy --
      # a check that names the themes itself goes stale the moment they are
      # renamed, which is exactly when the deploy matters most. What is worth
      # asserting is that the picker and the stylesheet agree, and that there
      # are still three of them.
      - name: Check the build is the one we think it is
        run: |
          set -euo pipefail
          page=landing/index.html

          themes=$(grep -o 'data-set="[a-z-]*"' "$page" | sed 's/.*="//;s/"//' | sort -u)
          count=$(echo "$themes" | grep -c . || true)
          if [ "$count" -ne 3 ]; then
            echo "::error::expected 3 themes in the switcher in $page, found $count"
            exit 1
          fi

          for theme in $themes; do
            grep -q "data-theme=\"$theme\"" "$page" || {
              echo "::error::the switcher offers $theme but $page has no data-theme=\"$theme\" rule"
              exit 1
            }
          done

          grep -q 'Anton' "$page" || { echo "::error::Anton is not in $page"; exit 1; }
          grep -q 'Bricolage Grotesque' "$page" || { echo "::error::Bricolage Grotesque is not in $page"; exit 1; }
          grep -q 'Big Shoulders' "$page" || { echo "::error::Big Shoulders is not in $page"; exit 1; }
          echo "three themes ($(printf '%s ' $themes)) and three display faces present"

      - name: Pull the project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Assemble the Build Output API directory by hand instead of running
      # `vercel build`.
      #
      # Two green runs and one red one were all the same bug wearing different
      # clothes: nobody here knows what the project's Root Directory setting is,
      # and `vercel build` resolves the whole build against it. Run from
      # `landing/` it produced an empty `.vercel/output` in 20ms and deployed
      # nothing. Run from the repo root -- the "fix" for that -- it decided the
      # REPOSITORY was the static site and copied `__tests__/`, `app/` and every
      # source file into the output, with no `index.html` anywhere in it. The
      # page guard caught that one before it shipped the source tree to a public
      # URL.
      #
      # So this step stops asking. `.vercel/output` is a documented contract --
      # static files in `static/`, routing in `config.json` -- and writing it
      # directly means the deploy publishes exactly the directory named here and
      # cannot be re-pointed by a dashboard setting nobody can see from CI.
      - name: Assemble the build output
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R landing/. .vercel/output/static/
          # Repo plumbing that is not part of the site. `vercel.json` in
          # particular would otherwise be served at /vercel.json, which is
          # config published as content.
          rm -rf .vercel/output/static/.vercel \
                 .vercel/output/static/.gitignore \
                 .vercel/output/static/vercel.json

          # The app goes under /app, matching experiments.baseUrl.
          mkdir -p .vercel/output/static/app
          cp -R dist-web/. .vercel/output/static/app/

          # `landing/vercel.json` is a project-level config and is NOT read from
          # a prebuilt output, so its one real behaviour is restated here as a
          # route. `cleanUrls` is not carried over because it has nothing to act
          # on: the site is a single index.html plus an icon directory.
          #
          # The app is `output: "single"`, a client-side-routed SPA, so a deep
          # link like /app/storm/abc123 asks for a file that was never
          # exported. `handle: filesystem` serves the real files first --
          # bundles, assets, the landing page itself -- and anything left over
          # under /app falls through to the app's index, where expo-router
          # picks the route back up on the client. The fallback is scoped to
          # /app so a genuinely missing landing-page URL still 404s honestly
          # instead of silently booting the app.
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/icons/(.*)$",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              {
                "src": "^/app/_expo/(.*)$",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "^/app(?:/.*)?$", "dest": "/app/index.html" }
            ]
          }
          JSON

      # An empty output is the failure that hid here for two green runs: the
      # page guard above passed, the deploy passed, and nothing served. It stays
      # even now that the output is assembled by hand, because it is what proves
      # the thing about to be published is the landing page and not a directory
      # that merely exists.
      - name: Check the build produced a page
        run: |
          set -euo pipefail
          out=.vercel/output/static/index.html
          if [ ! -s "$out" ]; then
            echo "::error::$out is missing or empty -- the output has no page in it"
            echo "what the output does contain:"
            find .vercel/output -maxdepth 3 2>/dev/null || echo "  (no .vercel/output at all)"
            exit 1
          fi
          grep -q 'data-set="' "$out" || {
            echo "::error::$out is not the landing page -- no theme picker in it"
            exit 1
          }
          echo "built page is $(wc -c < "$out") bytes"

          app=.vercel/output/static/app/index.html
          if [ ! -s "$app" ]; then
            echo "::error::$app is missing or empty -- the output has no app in it"
            find .vercel/output/static/app -maxdepth 2 2>/dev/null || echo "  (no app directory at all)"
            exit 1
          fi
          grep -q '/app/_expo/static/js' "$app" || {
            echo "::error::$app does not reference its bundle under /app"
            exit 1
          }
          echo "built app is $(wc -c < "$app") bytes"

      # Capture the deployment URL. Every production deploy gets an immutable
      # one; the stable domain is an alias pointed at it, and aliasing is a
      # separate act that the previous version of this workflow assumed had
      # already happened somewhere it could not see.
      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail
          deployed=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" | tail -n1)
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "deployment is $deployed"

      # Point the domain the README sends people to at the build we just made.
      #
      # This is the bug that outlived three fixes to the steps above. The
      # deploys were working the whole time -- they published to the project's
      # own immutable URL, which changes on every run and which nobody has ever
      # opened. Meanwhile README.md, the landing page footer and the submission
      # all link to SITE_DOMAIN, and that domain was still serving the manual
      # laptop deploy from months ago: a three-theme switcher called
      # day/night/card. A deploy nobody can reach at a URL anybody can is not
      # a deploy, and it is worth saying plainly that every green run in this
      # workflow's history was green about the wrong thing.
      #
      # `vercel alias set` is idempotent: once the domain is on this project it
      # simply re-points, and re-pointing to the current build is exactly what
      # each run should do. If the domain belongs to a DIFFERENT project this
      # fails, which is the answer we want out loud rather than another green
      # run over a stale page.
      - name: Point the site domain at this build
        run: |
          set -euo pipefail
          vercel alias set "${{ steps.deploy.outputs.deployed }}" "$SITE_DOMAIN"             --token="${{ secrets.VERCEL_TOKEN }}"

      # Read the domain back over the public internet, not from the CLI's own
      # report of success. The alias step can return zero and the DNS-facing
      # edge still serve the previous build, and it is the public page that the
      # README promises -- so this asks the same question an assessor would.
      - name: Check production serves the new page
        run: |
          set -euo pipefail
          url="https://$SITE_DOMAIN"
          themes=$(grep -o 'data-set="[a-z-]*"' landing/index.html | sed 's/.*="//;s/"//' | sort -u)

          # Retry the WHOLE check, not just the fetch.
          #
          # The first run of this step failed 400ms after `vercel alias set`
          # reported success, and it was right to: the edge was still handing
          # out the previous build. Curl's own --retry never fired, because a
          # stale page is a perfectly healthy 200. Propagation is the thing
          # being waited on, so the assertion is what has to be retried.
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 30 "$url" || true)
            missing=""
            for theme in $themes; do
              case "$body" in
                *"data-set=\"$theme\""*) ;;
                *) missing="$missing $theme" ;;
              esac
            done
            # The app is checked at the same edge and in the same retry, so a
            # half-propagated deploy fails rather than passing on the page
            # alone. /app is the URL a phone actually opens.
            appbody=$(curl -fsS --max-time 30 "$url/app" || true)
            case "$appbody" in
              *"/app/_expo/static/js"*) ;;
              *) missing="$missing the-app-at-/app" ;;
            esac

            if [ -z "$missing" ]; then
              echo "$url is serving this build, page and app (after ${attempt} attempt(s))"
              exit 0
            fi
            echo "attempt $attempt:$url is missing$missing -- waiting for the edge"
            sleep 5
          done

          echo "::error::$url never served this build -- still missing$missing after 12 attempts"
          exit 1
