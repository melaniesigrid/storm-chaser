<!--
  Storm Chaser app icon.

  The same bolt the in-app Monogram draws, at the same proportions, on the
  Skyward plate. The SC letters that ride the bolt inside the app are dropped
  here on purpose: at 48px on a home screen they collide with the bolt's own
  crossbar, and the mark is more recognisable as one silhouette than as a
  monogram nobody can resolve. The letters stay wherever the mark is shown
  larger than about 80px.

  Full bleed and unrounded: iOS and Android each mask their own corner shape,
  and rounding here would show as a double radius.

  Geometry mirrors BOLT in src/core/brand/Monogram.tsx, and the gradient is
  skyward-day's brand.ray in src/core/theme/themes.ts. Change one, change both.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB400"/>
      <stop offset="0.62" stop-color="#FF5A47"/>
      <stop offset="1" stop-color="#C4402E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="#14213A"/>

  <g transform="translate(19.1 20.3) scale(0.594)">
    <polygon points="56,-14 20,44 46,44 33,114 84,32 54,32 73,-14" fill="url(#ray)"/>
  </g>
</svg>
